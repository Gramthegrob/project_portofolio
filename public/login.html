<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bagaskara Dipowicaksono HP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-bg"></div>
  
  <div class="login-wrapper flex-center">
    <div class="login-card glass-panel">
      <div class="login-header">
        <a href="/" class="nav-brand gradient-text">Bagaskara D.</a>
        <h2>Admin Portal</h2>
        <p>Sign in to access the dashboard</p>
      </div>
      
      <div id="error-message" class="alert error hidden">Invalid credentials</div>
      <div id="lockout-message" class="alert warning hidden">
        Too many attempts. Try again in <span id="countdown">30</span>s.
      </div>
      
      <form id="login-form" class="login-form">
        <div class="form-group">
          <div class="input-icon user-icon"></div>
          <input type="text" id="username" class="form-input" placeholder="Username" required>
        </div>
        <div class="form-group password-group">
          <div class="input-icon lock-icon"></div>
          <input type="password" id="password" class="form-input" placeholder="Password" required>
          <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary login-btn">
          <span class="btn-text">Sign In</span>
          <span class="spinner hidden"></span>
        </button>
      </form>
      
      <div class="login-footer">
        <a href="/" class="back-link">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to Portfolio
        </a>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
